<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timetable</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
    }
    th {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
    }
    td {
      height: 60px;
    }
    tr:nth-child(even) td {
      background-color: #f9f9f9;
    }
    td.break {
      background-color: #ffecb3;
      font-weight: bold;
      color: #555;
    }
    td.subject {
      color: #333;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>Weekly Timetable</h2>
  <table>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
    </tr>
    <tr>
      <td>9:00 - 10:00</td>
      <td class="subject">Math</td>
      <td class="subject">Physics</td>
      <td class="subject">Biology</td>
      <td class="subject">English</td>
      <td class="subject">Chemistry</td>
    </tr>
    <tr>
      <td>10:00 - 11:00</td>
      <td class="subject">Science</td>
      <td class="subject">History</td>
      <td class="subject">Math</td>
      <td class="subject">Geography</td>
      <td class="subject">English</td>
    </tr>
    <tr>
      <td>11:00 - 11:30</td>
      <td colspan="5" class="break">Break</td>
    </tr>
    <tr>
      <td>11:30 - 12:30</td>
      <td class="subject">Biology</td>
      <td class="subject">English</td>
      <td class="subject">Chemistry</td>
      <td class="subject">Physics</td>
      <td class="subject">Math</td>
    </tr>
    <tr>
      <td>12:30 - 1:30</td>
      <td class="subject">History</td>
      <td class="subject">Math</td>
      <td class="subject">English</td>
      <td class="subject">Science</td>
      <td class="subject">Geography</td>
    </tr>
  </table>
</body>
</html>
